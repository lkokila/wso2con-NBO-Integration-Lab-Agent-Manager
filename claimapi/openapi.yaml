---
openapi: 3.0.1
info:
  title: Amani Claims Backend
  version: 0.1.0
  description: Claims and claimant data for Amani General Insurance. Backed by an
    in-memory store seeded at startup - no database. Both APIs share one port so the
    service fits a single WSO2 Agent Manager component.
servers:
- url: "{server}:{port}"
  variables:
    server:
      default: http://localhost
    port:
      default: '8080'
paths:
  "/claims":
    get:
      operationId: get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
  "/claims/{claimId}":
    get:
      operationId: getClaimid
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/journey":
    get:
      operationId: getClaimidJourney
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/JourneyStep"
        '500':
          description: InternalServerError
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/request-documents":
    post:
      operationId: postClaimidRequestDocuments
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RequestDocumentsRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/documents-received":
    post:
      operationId: postClaimidDocumentsReceived
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DocumentsReceivedRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/decision":
    post:
      operationId: postClaimidDecision
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DecisionRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/escalate":
    post:
      operationId: postClaimidEscalate
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EscalateRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/payment":
    post:
      operationId: postClaimidPayment
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/{claimId}/reset":
    post:
      operationId: postClaimidReset
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Claim"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/claims/health":
    get:
      operationId: getHealth
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
  "/customers/{customerId}":
    get:
      operationId: getCustomerid
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '500':
          description: InternalServerError
        '404':
          description: NotFound
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorPayload"
  "/customers/health":
    get:
      operationId: getHealth
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    Claim:
      required:
      - amount
      - claimId
      - claimType
      - createdAt
      - customerId
      - decision
      - decisionReason
      - description
      - documentsReceived
      - missingDocuments
      - paymentStatus
      - status
      - updatedAt
      type: object
      properties:
        claimId:
          type: string
        customerId:
          type: string
        claimType:
          type: string
        description:
          type: string
        amount:
          type: number
          format: double
        status:
          type: string
        documentsReceived:
          type: array
          items:
            type: string
        missingDocuments:
          type: array
          items:
            type: string
        decision:
          type: string
          nullable: true
        decisionReason:
          type: string
          nullable: true
        paymentStatus:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      additionalProperties: false
    DecisionRequest:
      required:
      - decision
      type: object
      properties:
        decision:
          type: string
        reason:
          type: string
          nullable: true
      additionalProperties: false
    DocumentsReceivedRequest:
      required:
      - documents
      type: object
      properties:
        documents:
          type: array
          items:
            type: string
      additionalProperties: false
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    EscalateRequest:
      required:
      - reason
      - summary
      type: object
      properties:
        reason:
          type: string
        summary:
          type: string
      additionalProperties: false
    JourneyStep:
      required:
      - claimId
      - detail
      - id
      - occurredAt
      - status
      - stepName
      type: object
      properties:
        id:
          type: integer
          format: int64
        claimId:
          type: string
        stepName:
          type: string
        status:
          type: string
        detail:
          type: string
          nullable: true
        occurredAt:
          type: string
      additionalProperties: false
    RequestDocumentsRequest:
      required:
      - missingDocuments
      type: object
      properties:
        missingDocuments:
          type: array
          items:
            type: string
      additionalProperties: false
    Customer:
      required:
      - customerId
      - email
      - name
      - phone
      type: object
      properties:
        customerId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      additionalProperties: false
