openapi: 3.0.1
info:
  title: Amani General Insurance - Claims Handling (MCP)
  version: 0.1.0
  description: |
    Claims handling toolset for AI agents, served over the Model Context Protocol
    using the Streamable HTTP transport.

    This is NOT a REST API, and this document does not describe one. MCP multiplexes
    every operation over a single endpoint as JSON-RPC 2.0 messages, so the tools the
    server exposes are not URL paths and cannot be enumerated here. This spec exists
    only to satisfy the OpenAPI schema required of a WSO2 Agent Manager `custom-api`
    component; it describes the transport, not the capability.

    The authoritative tool list is served by the protocol itself: initialize a session,
    then call `tools/list`. The seven tools are getClaimAssessment, getCustomerProfile,
    requestMissingDocuments, recordDocumentsReceived, decideClaim, escalateToAdjuster
    and settleClaim.

    Consumers should be MCP clients (such as `ai:McpToolKit`), never hand-written HTTP
    callers.
servers:
  - url: "{server}:{port}"
    variables:
      server:
        default: http://localhost
      port:
        default: "9091"
paths:
  /mcp:
    post:
      operationId: postMcpMessage
      summary: Send a JSON-RPC 2.0 request or notification
      description: |
        Carries every MCP operation: `initialize`, `notifications/initialized`,
        `tools/list`, `tools/call`. The method and its arguments live in the JSON-RPC
        body, not in the path. After initialize, echo the returned session id back on
        each subsequent request via `Mcp-Session-Id`.
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          description: Session id returned by `initialize`. Omitted on the initialize call itself.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcMessage"
      responses:
        "200":
          description: |
            A JSON-RPC response, or an SSE stream when the client accepts
            `text/event-stream` and the server streams the reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
            text/event-stream:
              schema:
                type: string
        "202":
          description: Notification accepted; no response body.
        "400":
          description: Malformed JSON-RPC message.
        "404":
          description: Unknown or expired session.
    get:
      operationId: openMcpStream
      summary: Open the server-to-client SSE stream
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An event stream of server-initiated messages.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Unknown or expired session.
    delete:
      operationId: endMcpSession
      summary: Terminate a session
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session terminated.
        "404":
          description: Unknown or expired session.
components:
  schemas:
    JsonRpcMessage:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Present on requests, absent on notifications.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          example: tools/call
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
